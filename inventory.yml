cluster_name: MyCluster
dse_version: "6.8"         # optional — auto-detected if omitted

defaults:
  ssh_user: ubuntu
  ssh_key:  ~/.ssh/id_rsa
  ssh_port: 22
  cassandra_yaml: /etc/dse/cassandra/cassandra.yaml
  dse_yaml:       /etc/dse/dse.yaml
  ssl_dir:        /etc/dse/ssl

nodes:
  - host: 10.1.1.1
    name: node1
    dc:   dc1

  - host: 10.1.1.2
    name: node2
    dc:   dc1

  - host: 10.1.1.3
    name: node3
    dc:   dc2

